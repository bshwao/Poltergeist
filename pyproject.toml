[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poltergeist"
version = "0.1.0"
description = "CARLA driving-safety simulation and failure discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "PyYAML>=6,<7",
    "sqlalchemy>=2,<3",
    "websockets>=17.2,<18",
    "httpx>=0.28,<1",
    # HTTPcore probes this on each async primitive; avoid repeated missing imports.
    "sniffio>=1.3.1,<2",
]

[project.optional-dependencies]
coordinator = ["argon2-cffi>=25.1,<26"]
dev = ["pytest>=8.4,<10", "httpx2>=2,<3"]
simulation = ["carla==0.9.16", "numpy>=2,<3", "opencv-python>=4.10,<5"]
optimization = ["optuna>=4,<5", "scipy>=1.15,<2"]

[project.scripts]
poltergeist-experiment = "scripts.run_experiment:main"
poltergeist-report = "scripts.export_report:main"
poltergeist-check-agent = "scripts.check_agent:main"
poltergeist-reference-ai = "scripts.run_reference_ai:main"
poltergeist-doctor = "scripts.doctor:main"
poltergeist-validate = "scripts.validate_installation:main"
poltergeist-companion = "scripts.companion:main"

[tool.setuptools.packages.find]
include = ["backend*", "shared*", "simulator*", "scenarios*", "evaluation*", "optimization*", "scripts*", "companion*", "coordinator*"]

[tool.setuptools.package-data]
companion = ["plant-cpu.lock.json", "release-policy.json", "LICENSE.plant-model", "LICENSE.antlr"]
scenarios = ["templates/*.yaml"]
simulator = ["agents/reference_ai/LICENSE.plant2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
