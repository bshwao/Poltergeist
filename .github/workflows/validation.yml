name: Validate supported workflows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=validation-tests.xml
      - run: python -m scripts.export_contracts --check
      - run: python -m scripts.doctor
      - name: Isolated agent and sensor workflow
        run: python -m scripts.validate_installation --mode test --sensors --duration .15 --seeds 7 --output validation-evidence
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir validation-wheel
      - name: Test non-editable wheel outside the checkout
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile, venv
          root = pathlib.Path.cwd()
          target = pathlib.Path(tempfile.mkdtemp(prefix='poltergeist-wheel-'))
          venv.create(target / 'environment', with_pip=True)
          python = target / 'environment' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          wheel = next((root / 'validation-wheel').glob('poltergeist-*.whl'))
          subprocess.run([str(python), '-m', 'pip', 'install', '-r', str(root / 'requirements-core.lock'), str(wheel)], check=True)
          subprocess.run([str(python), '-I', '-m', 'scripts.doctor'], cwd=target, check=True)
          subprocess.run([str(python), '-I', '-m', 'scripts.validate_installation', '--mode', 'test', '--sensors', '--duration', '.15', '--seeds', '7', '--examples-dir', str(root / 'examples'), '--output', str(target / 'evidence')], cwd=target, check=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: |
            validation-tests.xml
            validation-evidence/
          retention-days: 7
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run contracts:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-validation
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
