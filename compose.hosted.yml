name: poltergeist-hosted
services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
      args:
        VITE_COMPANION_DOWNLOAD_URL: ${POLTERGEIST_COMPANION_DOWNLOAD_URL:-}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --database
      - /data/coordinator/coordinator.db
      - --origin
      - ${POLTERGEIST_HOSTED_ORIGIN:?Set the coordinator HTTPS origin}
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --certfile
      - /tls/fullchain.pem
      - --keyfile
      - /tls/privkey.pem
      - --hosted-assets
      - /app/hosted
    ports:
      - target: 8443
        published: "${POLTERGEIST_HOSTED_PORT:-8443}"
        host_ip: ${POLTERGEIST_HOSTED_BIND:-127.0.0.1}
        protocol: tcp
    volumes:
      - coordinator-data:/data
      - type: bind
        source: ${POLTERGEIST_HOSTED_TLS_DIR:?Set the existing TLS directory outside the checkout}
        target: /tls
        read_only: true
        bind:
          create_host_path: false

volumes:
  coordinator-data:
