services:
  carla:
    image: carlasim/carla:0.9.16
    command: ./CarlaUE4.sh -RenderOffScreen
    ports:
      - "2000:2000"
      - "2001:2001"

  backend:
    build: .
    env_file:
      - .env
    environment:
      CARLA_HOST: carla
    ports:
      - "8000:8000"
    depends_on:
      - carla
